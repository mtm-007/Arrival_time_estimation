name: CI Tests
on: 
  pull_request:
    branches:
      - 'develop'
    paths: 
      - 'ci_cd/**'
env:
  AWS_DEFAULT_REGION: 'us-east-1'
  AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
  AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}

jobs:
  test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v2
      - name: Set up python 3.12
        uses: actions/setup-python@v2
        with:
          python-version: 3.12 
      
      - name: Install dependencies
        working-directory: "ci_cd"
        run: pip install pipenv && pipenv install --dev
      
      - name: Run unit tests
        working-directory: "ci-cd"
        run: pipenv run pytest tests/

      - name: Linting
        working-directory: "ci-cd"
        run: pipenv run pylint --recursive=y .
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with: 
          aws-access-key-id: ${{env.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{env.AWS_SECRET_ACCESS_KEY}}
          aws-region: 'us-east-1'
      
      - name: Integration Test
        working-directory: "ci-cd/integration-test"
        run: |
          . run.sh

tf-plan:
  runs-on: ubuntu-latest
  steps: 
    - uses: actions/checkout@v2
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v1
      with: 
        aws-access-key-id: ${{env.AWS_ACCESS_KEY_ID}}
        aws-secret-access-key: ${{env.AWS_SECRET_ACCESS_KEY}}
        aws-region: 'us-east-1'
    
    - uses: hashicorp/setup-terraform@v2

    - name: TF plan
      id: plan
      working-directory: "ci-cd/infra_as_code"
      run: |
        terraform init -backend-config="key=mlops-zm-prod.tfstate" --reconfigure && terraform plan -var-file=vars/prod.tfvars