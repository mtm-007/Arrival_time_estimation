name: CD-Deploy
on:
  push:
    branches:
      - 'develop'
    paths:
      - 'ci-cd/**'

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest 
    steps: 
      - name: Check out repo
        uses: actions/checkout@v3
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with: 
          aws-access-key-id: ${{env.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{env.AWS_SECRET_ACCESS_KEY}}
          aws-region: 'us-east-1'
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false
      
      #Define the infra
      - name: TF plan
        id: tf-plan
        working-directory: 'ci_cd/infra_as_code'
        run: |
          terraform init -backend-config="key=mlops-zm-prod.tfstate" -reconfigure && terraform plan -var-file=vars/prod.tfvars 
    
